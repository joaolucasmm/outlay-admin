server:
  port: ${PORT:8080}
  servlet:
    # Same base path as the contract's `servers` entry and the web app's API_BASE_URL.
    context-path: /api/v1

spring:
  application:
    name: tenant-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/outlay?connectionTimeZone=UTC&forceConnectionTimeMapping=true}
    username: ${DB_USER:outlay}
    password: ${DB_PASSWORD:outlay}
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema; Hibernate only checks the entities match it.
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration

outlay:
  cors:
    # The Vite dev server, `vite preview` and the Playwright preview.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173,http://localhost:4174}
