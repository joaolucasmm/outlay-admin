name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: TypeScript (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Contract types are up to date
        run: |
          pnpm --filter contracts generate
          git diff --exit-code -- packages/contracts/src/generated
      - name: Java demo seed matches the mock fixtures
        run: |
          pnpm seed:export
          git diff --exit-code -- services/tenant-api/src/main/resources/db/demo
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  e2e:
    name: End to end (Playwright + axe, production build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7

  e2e-live:
    name: End to end against the Java API (Playwright, Docker Compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start MySQL and the tenant API
        run: |
          docker compose up -d --build
          for i in $(seq 1 90); do curl -fsS http://localhost:8080/api/v1/health && break; sleep 2; done
      - run: pnpm --filter web exec playwright install --with-deps chromium
      # The main flow (onboard, set policy, check a receipt) on the Java API; AI stays mocked.
      - run: pnpm e2e
        env:
          E2E_API: live
      - name: Upload the Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-live
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 7
      - name: Compose logs on failure
        if: failure()
        run: docker compose logs

  ai:
    name: Python AI service (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  tenant-api:
    name: Java tenant API (JUnit, Testcontainers, contract, Compose)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/tenant-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Unit tests (shared lifecycle fixture), then *IT against MySQL in Testcontainers,
      # every response validated against packages/contracts/openapi.yaml.
      - run: ./mvnw -B verify
      - name: Docker Compose smoke test
        working-directory: .
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do curl -fsS http://localhost:8080/api/v1/health && break; sleep 2; done
          curl -fsS http://localhost:8080/api/v1/health | grep -q '"mode":"live"'
          curl -fsS -H 'X-Demo-Persona: per_operator' 'http://localhost:8080/api/v1/tenants?limit=3' | grep -q 'Bluefin Logistics'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/tenants)" = 401
      - name: Compose logs on failure
        if: failure()
        working-directory: .
        run: docker compose logs
