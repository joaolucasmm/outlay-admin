openapi: 3.1.0
info:
  title: Outlay Admin API
  version: 0.2.0
  description: >
    Contract for the Outlay Admin console. The MSW mock backend and the future
    tenant API both implement this file. Errors use RFC 9457 Problem Details.
    List endpoints use cursor pagination and return `{ items, nextCursor }`.
servers:
  - url: /api/v1
tags:
  - name: system
  - name: tenants
  - name: audit
  - name: program
    description: A tenant's expense program (categories and policy rules). Program Admin only.
  - name: demo
    description: Demo-only endpoints. Implemented by the mock backend, never by a real service.
security:
  - demoPersona: []
paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: Liveness check for the API (or the mock backend).
      security: []
      responses:
        '200':
          description: The API is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /tenants:
    get:
      tags: [tenants]
      operationId: listTenants
      summary: List tenants, sorted by name.
      description: >
        A Support Operator sees every tenant. A Program Admin sees only their own tenant.
      parameters:
        - name: q
          in: query
          description: Case-insensitive substring of the tenant name.
          schema: { type: string }
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TenantStatus'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of tenants.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TenantPage'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [tenants]
      operationId: createTenant
      summary: Start onboarding a tenant. It is created as `provisioning`. Emits `tenant.created`.
      description: Support Operator only. Names are unique, ignoring case.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TenantCreate'
      responses:
        '201':
          description: The new tenant, in `provisioning`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409':
          description: Another tenant already has this name.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /tenants/{tenantId}/program:apply-template:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      tags: [program]
      operationId: applyCategoryTemplate
      summary: Seed categories and policy rules from a template. Emits `program.template_applied`.
      description: >
        Support Operator only, while the tenant is `provisioning`. Idempotent: categories
        whose code already exists are skipped, so a retried onboarding step is safe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyTemplate'
      responses:
        '200':
          description: What was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateResult'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /tenants/{tenantId}/employees:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [program]
      operationId: listEmployees
      summary: List the tenant's employees, sorted by name. Program Admin only.
      parameters:
        - name: q
          in: query
          description: Case-insensitive substring of the name or email.
          schema: { type: string }
        - name: role
          in: query
          schema:
            $ref: '#/components/schemas/EmployeeRole'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of employees.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmployeePage'
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /tenants/{tenantId}/employees:import:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      tags: [program]
      operationId: importEmployees
      summary: Create employees in bulk, all or nothing. Emits `employees.imported`.
      description: >
        A Program Admin imports into their active tenant; a Support Operator only while
        the tenant is `provisioning` (onboarding). Emails are unique per tenant, ignoring
        case. If any row is invalid nothing is imported, and `errors[].field` points at it
        (e.g. `employees[3].email`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeImport'
      responses:
        '200':
          description: How many employees were created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResult'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /tenants/{tenantId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [tenants]
      operationId: getTenant
      responses:
        '200':
          description: The tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /tenants/{tenantId}/transitions:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    post:
      tags: [tenants]
      operationId: transitionTenant
      summary: Run a lifecycle action on a tenant. Emits an audit event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LifecycleCommand'
      responses:
        '200':
          description: The tenant after the transition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tenant'
        '401': { $ref: '#/components/responses/Problem' }
        '403':
          description: Only a Support Operator may run lifecycle actions.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: The action is not allowed from the tenant's current status.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: The command is invalid (missing reason, wrong confirmation name).
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /audit-events:
    get:
      tags: [audit]
      operationId: listAuditEvents
      summary: List audit events, newest first.
      description: >
        A Support Operator sees every event and may filter by tenant. A Program Admin
        only sees their own tenant's events.
      parameters:
        - name: tenantId
          in: query
          schema: { type: string }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of audit events.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

  /demo/personas:
    get:
      tags: [demo]
      operationId: listPersonas
      summary: Demo identities to sign in as.
      security: []
      responses:
        '200':
          description: The Support Operator plus one Program Admin per non-deprovisioned tenant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Persona'

  /tenants/{tenantId}/categories:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [program]
      operationId: listCategories
      summary: List the tenant's expense categories, sorted by code.
      parameters:
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: A page of categories.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryPage'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [program]
      operationId: createCategory
      summary: Create an expense category. Emits `category.created`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryCreate'
      responses:
        '201':
          description: The new category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseCategory'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: The tenant is not active, or the code is already used.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /tenants/{tenantId}/categories/{categoryId}:
    parameters:
      - $ref: '#/components/parameters/TenantId'
      - name: categoryId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [program]
      operationId: updateCategory
      summary: Rename, change the GL account, or (de)activate a category. Emits `category.updated`.
      description: Categories are never deleted; deactivating is the soft delete.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CategoryUpdate'
      responses:
        '200':
          description: The updated category.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExpenseCategory'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /tenants/{tenantId}/policy-rules:
    parameters:
      - $ref: '#/components/parameters/TenantId'
    get:
      tags: [program]
      operationId: getPolicyRules
      summary: The tenant's whole category × Employee Role policy grid.
      responses:
        '200':
          description: Every policy rule of the tenant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyRuleSet'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [program]
      operationId: replacePolicyRules
      summary: Replace the whole policy grid atomically. Emits one `policy.updated` event.
      description: >
        A (category, Employee Role) pair without a rule means the category is not
        allowed for that role.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyRulesReplace'
      responses:
        '200':
          description: The saved policy grid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyRuleSet'
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /demo/reset:
    post:
      tags: [demo]
      operationId: resetDemo
      summary: Restore the demo data to its seed.
      security: []
      responses:
        '204':
          description: The demo data was reset.

components:
  securitySchemes:
    demoPersona:
      type: apiKey
      in: header
      name: X-Demo-Persona
      description: Id of the demo persona making the request (see ADR 0002).

  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema: { type: string }
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `nextCursor`.
      schema: { type: string }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

  responses:
    Problem:
      description: An error, as RFC 9457 Problem Details.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Health:
      type: object
      required: [status, mode]
      properties:
        status:
          type: string
          enum: [ok]
        mode:
          type: string
          enum: [mock, live]
          description: Which backend answered.

    AdminRole:
      type: string
      enum: [support_operator, program_admin]

    TenantStatus:
      type: string
      enum: [provisioning, active, suspended, deprovisioned]

    Tenant:
      type: object
      required: [id, name, country, currency, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        country:
          type: string
          description: ISO 3166-1 alpha-2 country code.
        currency:
          type: string
          description: ISO 4217 currency code.
        status:
          $ref: '#/components/schemas/TenantStatus'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    TenantCreate:
      type: object
      required: [name, country, currency]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        country:
          type: string
          description: ISO 3166-1 alpha-2, one of the supported countries.
        currency:
          type: string
          description: ISO 4217, one of the supported currencies.

    CategoryTemplateId:
      type: string
      enum: [standard, empty]

    ApplyTemplate:
      type: object
      required: [templateId]
      properties:
        templateId:
          $ref: '#/components/schemas/CategoryTemplateId'

    TemplateResult:
      type: object
      required: [categoriesCreated, rulesCreated]
      properties:
        categoriesCreated: { type: integer, minimum: 0 }
        rulesCreated: { type: integer, minimum: 0 }

    EmployeeInput:
      type: object
      required: [name, email, role, costCenter]
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        email: { type: string, format: email, maxLength: 254 }
        role:
          $ref: '#/components/schemas/EmployeeRole'
        costCenter: { type: string, minLength: 1, maxLength: 40 }

    Employee:
      allOf:
        - $ref: '#/components/schemas/EmployeeInput'
        - type: object
          required: [id, tenantId]
          properties:
            id: { type: string }
            tenantId: { type: string }

    EmployeePage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Employee' }
        nextCursor:
          type: [string, 'null']

    EmployeeImport:
      type: object
      required: [employees]
      properties:
        employees:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: '#/components/schemas/EmployeeInput' }

    ImportResult:
      type: object
      required: [imported]
      properties:
        imported: { type: integer, minimum: 0 }

    TenantPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Tenant' }
        nextCursor:
          type: [string, 'null']

    LifecycleAction:
      type: string
      enum: [activate, suspend, reactivate, deprovision]

    LifecycleCommand:
      type: object
      required: [action]
      properties:
        action:
          $ref: '#/components/schemas/LifecycleAction'
        reason:
          type: string
          description: Required for `suspend`.
        confirmationName:
          type: string
          description: Required for `deprovision`; must equal the tenant name.

    Actor:
      type: object
      required: [id, role]
      properties:
        id: { type: string }
        role:
          $ref: '#/components/schemas/AdminRole'

    AuditEvent:
      type: object
      required: [id, tenantId, actor, action, entity, entityId, at]
      properties:
        id: { type: string }
        tenantId:
          type: [string, 'null']
        actor:
          $ref: '#/components/schemas/Actor'
        action:
          type: string
          description: Dotted verb, e.g. `tenant.suspended`.
        entity:
          type: string
          description: Entity type, e.g. `tenant`.
        entityId: { type: string }
        before:
          description: Relevant fields before the change.
        after:
          description: Relevant fields after the change.
        at: { type: string, format: date-time }

    AuditEventPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AuditEvent' }
        nextCursor:
          type: [string, 'null']

    Persona:
      type: object
      required: [id, label, role, tenantId]
      properties:
        id: { type: string }
        label: { type: string }
        role:
          $ref: '#/components/schemas/AdminRole'
        tenantId:
          type: [string, 'null']
          description: The Program Admin's tenant; null for the Support Operator.

    EmployeeRole:
      type: string
      enum: [employee, manager, director]

    ExpenseCategory:
      type: object
      required: [id, tenantId, code, name, glAccount, active]
      properties:
        id: { type: string }
        tenantId: { type: string }
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,19}$'
          description: Stable, unique per tenant, never changes. Used by receipt extraction.
        name: { type: string, minLength: 1, maxLength: 60 }
        glAccount:
          type: [string, 'null']
          maxLength: 20
          description: General-ledger account for accounting exports.
        active: { type: boolean }

    CategoryPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ExpenseCategory' }
        nextCursor:
          type: [string, 'null']

    CategoryCreate:
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          pattern: '^[A-Z][A-Z0-9_]{1,19}$'
        name: { type: string, minLength: 1, maxLength: 60 }
        glAccount:
          type: [string, 'null']
          maxLength: 20

    CategoryUpdate:
      type: object
      minProperties: 1
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        glAccount:
          type: [string, 'null']
          maxLength: 20
        active: { type: boolean }

    ApprovalLevels:
      type: integer
      enum: [0, 1, 2]
      description: 0 means auto-approved.

    PolicyRuleInput:
      type: object
      required: [categoryId, role, limitMinor, receiptRequiredAboveMinor, approvalLevels]
      properties:
        categoryId: { type: string }
        role:
          $ref: '#/components/schemas/EmployeeRole'
        limitMinor:
          type: integer
          minimum: 0
          description: Maximum per expense, in minor units of the tenant currency.
        receiptRequiredAboveMinor:
          type: integer
          minimum: 0
          description: A receipt is mandatory above this amount. Must not exceed the limit.
        approvalLevels:
          $ref: '#/components/schemas/ApprovalLevels'

    PolicyRule:
      allOf:
        - $ref: '#/components/schemas/PolicyRuleInput'
        - type: object
          required: [id, tenantId]
          properties:
            id: { type: string }
            tenantId: { type: string }

    PolicyRuleSet:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PolicyRule' }

    PolicyRulesReplace:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          items: { $ref: '#/components/schemas/PolicyRuleInput' }

    FindingSeverity:
      type: string
      enum: [info, warn, error]

    PolicyFinding:
      type: object
      required: [code, message, severity]
      properties:
        code: { type: string }
        message: { type: string }
        severity:
          $ref: '#/components/schemas/FindingSeverity'

    PolicyCheckResult:
      type: object
      required: [status, findings, requiredApprovalLevels]
      properties:
        status:
          type: string
          enum: [compliant, needs_approval, violation]
        findings:
          type: array
          items: { $ref: '#/components/schemas/PolicyFinding' }
        requiredApprovalLevels:
          $ref: '#/components/schemas/ApprovalLevels'

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
