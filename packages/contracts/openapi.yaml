openapi: 3.1.0
info:
  title: Outlay Admin API
  version: 0.1.0
  description: >
    Contract for the Outlay Admin console. The MSW mock backend and the future
    tenant API both implement this file. M0 only defines the health check.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getHealth
      summary: Liveness check for the API (or the mock backend).
      responses:
        '200':
          description: The API is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
components:
  schemas:
    Health:
      type: object
      required: [status, mode]
      properties:
        status:
          type: string
          enum: [ok]
        mode:
          type: string
          enum: [mock, live]
          description: Which backend answered.
