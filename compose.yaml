# Local stack for the live tenant API: MySQL 8 + services/tenant-api (demo profile).
#   docker compose up --build
#   VITE_API_MODE=live VITE_API_URL=http://localhost:8080/api/v1 pnpm dev
# Credentials are local development defaults, not secrets; override them through the environment.
name: outlay

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: outlay
      MYSQL_USER: ${DB_USER:-outlay}
      MYSQL_PASSWORD: ${DB_PASSWORD:-outlay}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-outlay-root}
    ports:
      # 3307 on the host, so a local MySQL on 3306 does not collide.
      - '${MYSQL_HOST_PORT:-3307}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test:
        ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -u"$$MYSQL_USER" -p"$$MYSQL_PASSWORD" --silent']
      interval: 5s
      timeout: 5s
      retries: 30

  tenant-api:
    build:
      context: .
      dockerfile: services/tenant-api/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: demo
      DB_URL: jdbc:mysql://mysql:3306/outlay?connectionTimeZone=UTC&forceConnectionTimeMapping=true
      DB_USER: ${DB_USER:-outlay}
      DB_PASSWORD: ${DB_PASSWORD:-outlay}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:4173}
    ports:
      - '8080:8080'
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
